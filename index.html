<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心靈迷宮：理論大挑戰</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            color: #2c3e50;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        #game-container {
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 2.5rem;
            margin-top: 3rem;
            margin-bottom: 3rem;
            width: 95%;
            max-width: 900px;
            border: 1px solid #e1e8ed;
        }

        #board-wrapper {
            position: relative;
            margin-bottom: 2.5rem;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 15px;
            border: 2px dashed #bdc3c7;
        }

        #board {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 12px;
        }

        .cell {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 1rem 0.5rem;
            text-align: center;
            min-height: 90px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            position: relative;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            cursor: default;
        }

        .cell:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
        }

        .cell.active {
            background-color: #3498db;
            color: white;
            box-shadow: 0 0 15px rgba(52, 152, 219, 0.6);
            transform: scale(1.05);
            z-index: 10;
        }

        /* Theory specific styling */
        .cell.psychoanalysis { border: 3px solid #e74c3c; background: #fff5f5; }
        .cell.object-relations { border: 3px solid #2ecc71; background: #f0fdf4; }
        .cell.jungian { border: 3px solid #f1c40f; background: #fefce8; }
        .cell.start-cell { border: 3px solid #95a5a6; background: #ecf0f1; }
        .cell.end-cell { border: 3px solid #9b59b6; background: #f4ecf7; color: #8e44ad; }

        .player-token {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            position: absolute;
            bottom: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            transition: all 0.5s ease;
            z-index: 20;
        }
        .player1-token { background: radial-gradient(circle at 30% 30%, #ff7675, #e74c3c); left: 10px; }
        .player2-token { background: radial-gradient(circle at 30% 30%, #55efc4, #2ecc71); right: 10px; }

        #info-panel {
            display: flex;
            justify-content: space-between;
            margin-bottom: 2rem;
            gap: 1rem;
        }

        .player-info {
            padding: 1.5rem;
            border-radius: 12px;
            background-color: #ffffff;
            width: 48%;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .player-info.current-turn {
            border: 2px solid #3498db;
            background-color: #f0f8ff;
            transform: scale(1.02);
            box-shadow: 0 8px 15px rgba(52, 152, 219, 0.2);
        }

        .btn-primary {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1.2rem;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.4);
            transition: all 0.3s ease;
        }

        .btn-primary:hover:not(:disabled) { 
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(52, 152, 219, 0.6);
        }
        
        .btn-primary:active:not(:disabled) {
            transform: translateY(1px);
        }

        .btn-primary:disabled { 
            background: #bdc3c7; 
            cursor: not-allowed; 
            box-shadow: none;
        }

        /* Dice animation */
        @keyframes roll {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .rolling { animation: roll 0.5s ease-out; }

        #modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #modal.show {
            display: flex;
            opacity: 1;
        }

        #modal-content {
            background-color: white;
            padding: 2.5rem;
            border-radius: 15px;
            max-width: 550px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }

        #modal.show #modal-content {
            transform: translateY(0);
        }

        .theory-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 1rem;
            color: white;
        }
        .badge-psychoanalysis { background-color: #e74c3c; }
        .badge-object-relations { background-color: #2ecc71; }
        .badge-jungian { background-color: #f1c40f; color: #333; }
        .badge-system { background-color: #95a5a6; }

        /* 新增角色選擇與音效相關樣式 */
        #char-selection-screen {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease;
        }
        .char-card {
            background: white;
            border-radius: 15px;
            padding: 2rem;
            margin: 1rem;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            border: 3px solid transparent;
            transition: all 0.3s ease;
            width: 200px;
        }
        .char-card:hover { transform: translateY(-10px); box-shadow: 0 15px 30px rgba(0,0,0,0.1); }
        .char-card.selected { opacity: 0.5; cursor: not-allowed; filter: grayscale(100%); }
        .char-icon { font-size: 4rem; margin-bottom: 1rem; }
        
        .player-token {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            position: absolute;
            bottom: 4px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            transition: all 0.5s ease;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: white;
            border: 2px solid white;
        }
    </style>
</head>
<body>

    <!-- 角色選擇畫面 -->
    <div id="char-selection-screen">
        <h1 class="text-4xl font-extrabold mb-2 text-gray-800 tracking-wide">心靈迷宮：大富翁</h1>
        <p class="text-xl text-gray-500 mb-8">選擇你的心理學大師</p>
        <h2 id="select-prompt" class="text-3xl font-bold mb-6 text-blue-600">玩家 1 請選擇角色</h2>
        <div id="char-cards-container" class="flex flex-wrap justify-center max-w-4xl">
            <!-- 由 JS 動態產生 -->
        </div>
    </div>

    <div id="game-container" style="display: none;">
        <h1 class="text-4xl font-extrabold text-center mb-2 text-gray-800 tracking-wide">心靈迷宮</h1>
        <p class="text-center text-gray-500 mb-8 text-lg">心理學理論大挑戰</p>
        
        <div id="info-panel">
            <div id="player1-info" class="player-info current-turn">
                <div class="flex items-center mb-2">
                    <div id="p1-avatar" class="w-10 h-10 rounded-full flex items-center justify-center text-2xl mr-2 shadow-sm text-white"></div>
                    <h2 id="p1-name" class="text-2xl font-bold text-gray-800">玩家 1</h2>
                </div>
                <div class="grid grid-cols-2 gap-2 mt-4 text-sm">
                    <div class="bg-gray-50 p-2 rounded text-center">
                        <span class="block text-gray-500">位置</span>
                        <span id="p1-pos" class="font-bold text-lg text-gray-700">0</span>
                    </div>
                    <div class="bg-gray-50 p-2 rounded text-center" title="可用來抵消負面事件">
                        <span class="block text-gray-500">防衛卡</span>
                        <span id="p1-cards" class="font-bold text-lg">0</span>
                    </div>
                    <div class="bg-gray-50 p-2 rounded text-center col-span-2">
                        <span class="block text-gray-500">自我統整進度</span>
                        <div class="w-full bg-gray-200 rounded-full h-2.5 mt-1">
                            <div id="p1-integration-bar" class="h-2.5 rounded-full transition-all duration-500" style="width: 0%"></div>
                        </div>
                        <span id="p1-integration" class="font-bold text-gray-700 block mt-1">0%</span>
                    </div>
                </div>
                <div id="p1-status" class="mt-2 text-sm font-bold h-5"></div>
            </div>
            
            <div id="player2-info" class="player-info">
                <div class="flex items-center mb-2">
                    <div id="p2-avatar" class="w-10 h-10 rounded-full flex items-center justify-center text-2xl mr-2 shadow-sm text-white"></div>
                    <h2 id="p2-name" class="text-2xl font-bold text-gray-800">玩家 2</h2>
                </div>
                <div class="grid grid-cols-2 gap-2 mt-4 text-sm">
                    <div class="bg-gray-50 p-2 rounded text-center">
                        <span class="block text-gray-500">位置</span>
                        <span id="p2-pos" class="font-bold text-lg text-gray-700">0</span>
                    </div>
                    <div class="bg-gray-50 p-2 rounded text-center" title="可用來抵消負面事件">
                        <span class="block text-gray-500">防衛卡</span>
                        <span id="p2-cards" class="font-bold text-lg">0</span>
                    </div>
                    <div class="bg-gray-50 p-2 rounded text-center col-span-2">
                        <span class="block text-gray-500">自我統整進度</span>
                        <div class="w-full bg-gray-200 rounded-full h-2.5 mt-1">
                            <div id="p2-integration-bar" class="h-2.5 rounded-full transition-all duration-500" style="width: 0%"></div>
                        </div>
                        <span id="p2-integration" class="font-bold text-gray-700 block mt-1">0%</span>
                    </div>
                </div>
                <div id="p2-status" class="mt-2 text-sm font-bold h-5"></div>
            </div>
        </div>

        <div id="board-wrapper">
            <div id="board">
                <!-- Board cells generated by JS -->
            </div>
        </div>

        <div id="action-area" class="text-center">
            <button id="roll-btn" class="btn-primary flex items-center justify-center mx-auto gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><circle cx="15.5" cy="15.5" r="1.5"></circle><circle cx="15.5" cy="8.5" r="1.5"></circle><circle cx="8.5" cy="15.5" r="1.5"></circle></svg>
                <span>擲骰子 (1-4)</span>
            </button>
            <div id="dice-result" class="text-3xl font-black mt-4 text-gray-700 h-10"></div>
        </div>

        <div class="mt-8 pt-4 border-t border-gray-200 text-sm text-gray-500 flex justify-center gap-4">
            <span class="flex items-center"><span class="w-3 h-3 bg-red-100 border-2 border-red-500 rounded inline-block mr-1"></span> 精神分析</span>
            <span class="flex items-center"><span class="w-3 h-3 bg-green-100 border-2 border-green-500 rounded inline-block mr-1"></span> 客體關係</span>
            <span class="flex items-center"><span class="w-3 h-3 bg-yellow-50 border-2 border-yellow-400 rounded inline-block mr-1"></span> 榮格分析</span>
        </div>
    </div>

    <!-- Event Modal -->
    <div id="modal">
        <div id="modal-content">
            <div id="modal-badge" class="theory-badge badge-system">系統訊息</div>
            <h2 id="modal-title" class="text-3xl font-black mb-4 text-gray-800"></h2>
            <p id="modal-desc" class="mb-8 text-lg text-gray-600 leading-relaxed"></p>
            <div id="modal-actions">
                <button id="modal-close-btn" class="btn-primary w-full">確認並繼續</button>
            </div>
        </div>
    </div>

    <script>
        const NUM_CELLS = 24; // Expanded board
        const THEMES = ['psychoanalysis', 'object-relations', 'jungian'];
        const THEME_NAMES = {
            'psychoanalysis': '精神分析',
            'object-relations': '客體關係',
            'jungian': '榮格分析'
        };

        // --- 音效系統 (Web Audio API 產生自製音效) ---
        let audioCtx;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playTone(freq, type, duration, vol=0.1) {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        const sfx = {
            roll: () => playTone(800, 'square', 0.05, 0.02),
            move: () => playTone(400, 'sine', 0.1, 0.05),
            positive: () => { playTone(523.25, 'sine', 0.1); setTimeout(()=>playTone(659.25, 'sine', 0.2), 100); },
            negative: () => { playTone(200, 'sawtooth', 0.2); setTimeout(()=>playTone(150, 'sawtooth', 0.3), 200); },
            win: () => { playTone(440, 'square', 0.1); setTimeout(()=>playTone(554, 'square', 0.1), 150); setTimeout(()=>playTone(659, 'square', 0.4), 300); }
        };

        // --- 角色系統 ---
        const CHARACTERS = [
            { id: 'freud', name: '佛洛依德', icon: '🧔🏻‍♂️', color: '#e74c3c', desc: '精神分析大師' },
            { id: 'klein', name: '克萊恩', icon: '👩🏻‍⚕️', color: '#2ecc71', desc: '客體關係大師' },
            { id: 'jung', name: '榮格', icon: '🧙🏼‍♂️', color: '#f1c40f', desc: '分析心理學大師' }
        ];

        let selectedCharacters = [];
        let selectingPlayer = 1;

        function renderCharSelection() {
            const container = document.getElementById('char-cards-container');
            container.innerHTML = '';
            CHARACTERS.forEach(char => {
                const isSelected = selectedCharacters.includes(char);
                const div = document.createElement('div');
                div.className = `char-card ${isSelected ? 'selected' : ''}`;
                div.style.borderColor = char.color;
                div.innerHTML = `
                    <div class="char-icon">${char.icon}</div>
                    <h3 class="text-2xl font-bold mb-2" style="color: ${char.color}">${char.name}</h3>
                    <p class="text-gray-500">${char.desc}</p>
                `;
                if (!isSelected) {
                    div.onclick = () => selectCharacter(char);
                }
                container.appendChild(div);
            });
        }

        function selectCharacter(char) {
            initAudio(); // 玩家首次點擊時初始化音效引擎
            sfx.positive();
            
            selectedCharacters.push(char);
            if (selectingPlayer === 1) {
                selectingPlayer = 2;
                document.getElementById('select-prompt').innerText = '玩家 2 請選擇角色';
                document.getElementById('select-prompt').className = 'text-3xl font-bold mb-6 text-green-600';
                renderCharSelection();
            } else {
                // 兩位玩家都選好了，開始遊戲
                document.getElementById('char-selection-screen').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('char-selection-screen').style.display = 'none';
                    document.getElementById('game-container').style.display = 'block';
                    startGame();
                }, 500);
            }
        }

        // Expanded Event deck based on the 3 theories
        const EVENTS = {
            'psychoanalysis': [
                { title: '本我衝動爆發', desc: '強烈的慾望讓你感到焦慮，退化機制啟動。退後 1 步。', effect: (p) => movePlayer(p, -1) },
                { title: '成功昇華', desc: '你將不被認可的衝動轉化為藝術創作！獲得 1 張防衛機制卡，整合進度 +5%。', effect: (p) => { addCard(p, 1); addIntegration(p, 5); } },
                { title: '潛伏期', desc: '性本能進入休眠，你將精力放在學校與友誼。前進 1 步。', effect: (p) => movePlayer(p, 1) },
                { title: '遭遇固著', desc: '你在發展階段遭遇嚴重挫折產生固著，停滯不前。暫停一回合。', effect: (p) => setSkipTurn(p, true) },
                { title: '自我覺察', desc: '透過自由聯想，你察覺了潛意識的壓抑。獲得 1 張防衛機制卡。', effect: (p) => addCard(p, 1) }
            ],
            'object-relations': [
                { title: '共生期融合', desc: '你感受到與他人的完美共生，獲得極大安全感。前進 2 步。', effect: (p) => movePlayer(p, 2) },
                { title: '投射性認同', desc: '你被他人的「壞客體」投射影響，陷入混亂情緒。整合進度 -10%。', effect: (p) => addIntegration(p, -10) },
                { title: '建立客體恆久性', desc: '你成功整合了好與壞的客體經驗，達成自我認同！整合進度 +20%。', effect: (p) => addIntegration(p, 20) },
                { title: '夠好的母親', desc: '環境提供了適當的回應，滋養了你的「真我」。前進 1 步，獲得 1 張防衛卡。', effect: (p) => { movePlayer(p, 1); addCard(p, 1); } },
                { title: '分離焦慮', desc: '在實踐期與母親分離讓你感到恐慌。退後 1 步。', effect: (p) => movePlayer(p, -1) }
            ],
            'jungian': [
                { title: '探索個人潛意識', desc: '你深入潛意識，直面被壓抑的情結。獲得 1 張防衛卡並前進 1 步。', effect: (p) => { addCard(p, 1); movePlayer(p, 1); } },
                { title: '遭遇陰影 (Shadow)', desc: '你直面內心黑暗面！若無防衛機制卡化解，將退後 2 步並扣除整合進度。', effect: (p) => handleShadow(p) },
                { title: '整合阿尼瑪/阿尼瑪斯', desc: '你接納了內在的異性特質，朝向自性邁進大步。整合進度 +25%。', effect: (p) => addIntegration(p, 25) },
                { title: '面具我 (Persona) 的束縛', desc: '過度迎合社會期待讓你迷失自我。暫停一回合。', effect: (p) => setSkipTurn(p, true) },
                { title: '曼陀羅體驗', desc: '透過繪製曼陀羅，你感受到心靈的平靜與秩序。整合進度 +15%。', effect: (p) => addIntegration(p, 15) }
            ]
        };

        let players = [
            { id: 0, pos: 0, cards: 0, integration: 0, skipTurn: false },
            { id: 1, pos: 0, cards: 0, integration: 0, skipTurn: false }
        ];
        let currentPlayerIndex = 0;
        let boardThemes = [];

        function startGame() {
            players = [
                { id: 0, pos: 0, cards: 0, integration: 0, skipTurn: false, char: selectedCharacters[0] },
                { id: 1, pos: 0, cards: 0, integration: 0, skipTurn: false, char: selectedCharacters[1] }
            ];
            currentPlayerIndex = 0;
            document.getElementById('roll-btn').disabled = false;
            document.getElementById('dice-result').innerText = '';
            
            // 初始化玩家 UI
            setupPlayerUI(0);
            setupPlayerUI(1);
            
            initBoard();
            updateUI();
        }

        function setupPlayerUI(index) {
            const p = players[index];
            const prefix = `p${index + 1}`;
            document.getElementById(`${prefix}-name`).innerText = p.char.name;
            document.getElementById(`${prefix}-avatar`).innerText = p.char.icon;
            document.getElementById(`${prefix}-avatar`).style.backgroundColor = p.char.color;
            document.getElementById(`${prefix}-cards`).style.color = p.char.color;
            document.getElementById(`${prefix}-integration-bar`).style.backgroundColor = p.char.color;
            document.getElementById(`${prefix}-status`).style.color = p.char.color;
        }

        function initBoard() {
            const board = document.getElementById('board');
            board.innerHTML = '';
            boardThemes = [];

            // Start Cell
            let startCell = document.createElement('div');
            startCell.className = 'cell start-cell active';
            startCell.id = 'cell-0';
            startCell.innerHTML = '<span class="text-lg">起點</span>';
            board.appendChild(startCell);
            boardThemes.push('start');

            // Generate path
            for (let i = 1; i < NUM_CELLS - 1; i++) {
                const cell = document.createElement('div');
                // Ensure consecutive cells don't have the same theme too often
                let theme;
                do {
                    theme = THEMES[Math.floor(Math.random() * THEMES.length)];
                } while (i > 1 && theme === boardThemes[i-1] && Math.random() > 0.3);
                
                boardThemes.push(theme);
                
                cell.className = `cell ${theme}`;
                cell.id = `cell-${i}`;
                cell.innerHTML = `<span class="text-xl text-gray-700 opacity-30 absolute top-2 right-2">${i}</span>
                                  <span class="text-sm mt-2">${THEME_NAMES[theme]}</span>`;
                board.appendChild(cell);
            }

            // End Cell
            let endCell = document.createElement('div');
            endCell.className = 'cell end-cell';
            endCell.id = `cell-${NUM_CELLS - 1}`;
            endCell.innerHTML = '<span class="text-lg font-black">統整我<br><span class="text-xs font-normal">(終點)</span></span>';
            board.appendChild(endCell);
            boardThemes.push('end');

            updateTokens(); // Initial token placement
        }

        function updateUI() {
            // Update Text
            document.getElementById('p1-pos').innerText = players[0].pos;
            document.getElementById('p1-cards').innerText = players[0].cards;
            document.getElementById('p1-integration').innerText = players[0].integration + '%';
            document.getElementById('p1-integration-bar').style.width = players[0].integration + '%';
            
            document.getElementById('p2-pos').innerText = players[1].pos;
            document.getElementById('p2-cards').innerText = players[1].cards;
            document.getElementById('p2-integration').innerText = players[1].integration + '%';
            document.getElementById('p2-integration-bar').style.width = players[1].integration + '%';

            // Update Turn Highlighting
            document.getElementById('player1-info').classList.toggle('current-turn', currentPlayerIndex === 0);
            document.getElementById('player2-info').classList.toggle('current-turn', currentPlayerIndex === 1);

            // Update Status Text
            document.getElementById('p1-status').innerText = players[0].skipTurn ? "固著中 (暫停)" : "";
            document.getElementById('p2-status').innerText = players[1].skipTurn ? "固著中 (暫停)" : "";

            updateTokens();
        }

        function updateTokens() {
            document.querySelectorAll('.player-token').forEach(el => el.remove());
            document.querySelectorAll('.cell').forEach(el => el.classList.remove('active'));
            
            players.forEach(p => {
                const targetCell = document.getElementById(`cell-${p.pos}`);
                if (targetCell) {
                    targetCell.classList.add('active');
                    const token = document.createElement('div');
                    token.className = `player-token shadow-lg`;
                    token.style.backgroundColor = p.char.color;
                    token.innerText = p.char.icon;
                    
                    // 如果兩個玩家在同一格，稍微錯開位置避免完全重疊
                    if (players[0].pos === players[1].pos) {
                        token.style[p.id === 0 ? 'left' : 'right'] = '5px';
                    } else {
                        token.style.left = '50%';
                        token.style.transform = 'translateX(-50%)';
                    }
                    targetCell.appendChild(token);
                }
            });
        }

        function showModal(theme, title, desc, onConfirm) {
            const modal = document.getElementById('modal');
            const badge = document.getElementById('modal-badge');
            
            badge.className = `theory-badge badge-${theme}`;
            if(theme === 'system') badge.innerText = '系統訊息';
            else badge.innerText = THEME_NAMES[theme] || '事件';

            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-desc').innerHTML = desc;
            
            modal.classList.add('show');
            
            const btn = document.getElementById('modal-close-btn');
            // Remove old listeners
            const newBtn = btn.cloneNode(true);
            btn.parentNode.replaceChild(newBtn, btn);
            
            newBtn.onclick = () => {
                modal.classList.remove('show');
                if(onConfirm) setTimeout(onConfirm, 300); // Wait for fade out
            };
        }

        function movePlayer(playerIndex, steps) {
            let p = players[playerIndex];
            p.pos += steps;
            if (p.pos < 0) p.pos = 0;
            if (p.pos >= NUM_CELLS - 1) {
                p.pos = NUM_CELLS - 1;
                // Don't check win condition immediately if moved by event, wait for event flow
            }
        }

        function addCard(playerIndex, amount) {
            players[playerIndex].cards += amount;
            if (players[playerIndex].cards < 0) players[playerIndex].cards = 0;
        }

        function addIntegration(playerIndex, amount) {
            players[playerIndex].integration += amount;
            if (players[playerIndex].integration < 0) players[playerIndex].integration = 0;
            if (players[playerIndex].integration > 100) players[playerIndex].integration = 100;
        }

        function setSkipTurn(playerIndex, value) {
            players[playerIndex].skipTurn = value;
        }

        function handleShadow(playerIndex) {
            if (players[playerIndex].cards > 0) {
                players[playerIndex].cards--;
                sfx.positive();
                showModal('system', '防衛機制啟動', `${players[playerIndex].char.name} 消耗了 1 張防衛卡，成功將陰影「合理化」，化解了危機！`, () => {
                    updateUI();
                    nextTurn();
                });
            } else {
                movePlayer(playerIndex, -2);
                addIntegration(playerIndex, -10);
                sfx.negative();
                showModal('system', '被陰影吞噬', `${players[playerIndex].char.name} 沒有防衛卡保護，無法承受潛意識的衝擊。退後 2 步，整合度 -10%。`, () => {
                    updateUI();
                    nextTurn();
                });
            }
        }

        function triggerEvent(playerIndex, theme) {
            if (theme === 'start' || theme === 'end') return;

            const eventsList = EVENTS[theme];
            const evt = eventsList[Math.floor(Math.random() * eventsList.length)];
            
            // 根據事件描述粗略判斷音效
            if (evt.desc.includes('退後') || evt.desc.includes('扣除') || evt.desc.includes('暫停') || evt.desc.includes('-')) {
                sfx.negative();
            } else {
                sfx.positive();
            }

            showModal(theme, evt.title, evt.desc, () => {
                // Determine if the effect handles the next turn itself (like handleShadow)
                const isSpecialEffect = evt.title.includes('陰影');
                
                evt.effect(playerIndex);
                updateUI();
                
                // If player reached end due to event movement
                if(players[playerIndex].pos >= NUM_CELLS -1) {
                    checkWinCondition(playerIndex);
                    return;
                }

                if(!isSpecialEffect) {
                    nextTurn();
                }
            });
        }

        function nextTurn() {
            if (players[0].pos >= NUM_CELLS - 1 || players[1].pos >= NUM_CELLS - 1) return;

            currentPlayerIndex = (currentPlayerIndex + 1) % 2;
            updateUI();
            
            if (players[currentPlayerIndex].skipTurn) {
                players[currentPlayerIndex].skipTurn = false;
                sfx.negative();
                showModal('system', '固著狀態', `${players[currentPlayerIndex].char.name} 仍在處理上一階段的固著，本回合無法行動。`, () => {
                    updateUI();
                    nextTurn();
                });
            } else {
                document.getElementById('roll-btn').disabled = false;
            }
        }

        function checkWinCondition(playerIndex) {
            const p = players[playerIndex];
            document.getElementById('roll-btn').disabled = true;
            sfx.win();
            
            let winTitle = `遊戲結束！${p.char.name} 抵達終點`;
            let winMsg = "";

            if (p.integration >= 80) {
                winMsg = `<span class="text-green-600 font-bold text-xl block mb-2">達成「自我統整」境界！</span>
                          您的整合度高達 ${p.integration}%。<br>
                          您成功接納了本我的衝動、建立了穩定的客體關係，並整合了潛意識的原型。您是心靈成長的贏家！`;
            } else {
                winMsg = `<span class="text-yellow-600 font-bold text-xl block mb-2">達成「未完成的個體化」</span>
                          您的整合度為 ${p.integration}%。<br>
                          雖然抵達了終點，但心靈深處仍有許多未解的衝突與陰影。需要繼續進行心理分析的旅程。`;
            }
            
            showModal('system', winTitle, winMsg, () => {
                showModal('system', '重新開始', '要再來一場心靈探索之旅嗎？', resetGame);
            });
        }

        function resetGame() {
            selectedCharacters = [];
            selectingPlayer = 1;
            document.getElementById('select-prompt').innerText = '玩家 1 請選擇角色';
            document.getElementById('select-prompt').className = 'text-3xl font-bold mb-6 text-blue-600';
            renderCharSelection();
            
            // 顯示選擇畫面，隱藏遊戲畫面
            document.getElementById('char-selection-screen').style.display = 'flex';
            document.getElementById('char-selection-screen').style.opacity = '1';
            document.getElementById('game-container').style.display = 'none';
        }

        document.getElementById('roll-btn').addEventListener('click', () => {
            const btn = document.getElementById('roll-btn');
            const resultDiv = document.getElementById('dice-result');
            
            btn.disabled = true;
            
            // Visual roll effect
            let rolls = 0;
            const rollInterval = setInterval(() => {
                sfx.roll();
                resultDiv.innerText = `🎲 ${Math.floor(Math.random() * 4) + 1}`;
                rolls++;
                if(rolls > 10) {
                    clearInterval(rollInterval);
                    
                    // Actual logic (Roll 1-4 for more events)
                    const dice = Math.floor(Math.random() * 4) + 1;
                    resultDiv.innerHTML = `移動 <span class="text-blue-600">${dice}</span> 步`;
                    
                    sfx.move();
                    movePlayer(currentPlayerIndex, dice);
                    updateUI();

                    const currentCellTheme = boardThemes[players[currentPlayerIndex].pos];
                    
                    if (currentCellTheme === 'end') {
                        setTimeout(() => checkWinCondition(currentPlayerIndex), 500);
                    } else if (currentCellTheme !== 'start') {
                        setTimeout(() => {
                            triggerEvent(currentPlayerIndex, currentCellTheme);
                        }, 600);
                    } else {
                        setTimeout(nextTurn, 600);
                    }
                }
            }, 50);
        });

        // Initialize on load
        window.onload = () => {
            renderCharSelection();
        };

    </script>
</body>
</html>
